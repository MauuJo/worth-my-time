services:
  - type: web
    name: worth-my-time
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GITHUB_TOKEN
        sync: false
      - key: ENABLE_BRIEF
        value: "false"
